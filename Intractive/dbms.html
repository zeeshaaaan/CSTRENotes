<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBMS — Interactive Notes</title>
<style>
:root{--ink:#15233b;--ink2:#51607a;--paper:#f3f6f2;--grid:#e3e9e4;--panel:#fff;--teal:#0a8f7b;--teal2:#d8f1ea;--amber:#d98e04;--amber2:#fff0c9;--red:#c43d2f;--red2:#fbe3df;--blue:#2c5fb3;--blue2:#e2ebf8;--line:#b8c3bc;
--serif:"Charter","Iowan Old Style","Palatino Linotype",Georgia,serif;--ui:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--serif)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
nav#nav{position:fixed;inset:0 auto 0 0;width:262px;background:#fff;border-right:1.5px solid var(--ink);overflow:auto;padding:18px 0 30px;font-family:var(--ui);z-index:5}
nav#nav .brand{padding:0 20px 14px;font-weight:800;font-size:17px;line-height:1.2;border-bottom:1.5px solid var(--ink);margin-bottom:8px}
nav#nav .brand small{display:block;font-weight:500;color:var(--ink2);font-size:12.5px;margin-top:4px}
nav#nav a{display:block;padding:7px 20px 7px 17px;color:var(--ink);text-decoration:none;font-size:14.5px;border-left:3px solid transparent}
nav#nav a:hover{background:var(--teal2)}
nav#nav a.act{border-left-color:var(--teal);background:var(--teal2);font-weight:700}
nav#nav a span{display:inline-block;width:22px;color:var(--ink2);font-family:var(--mono);font-size:12.5px}
main{margin-left:262px;padding:0 0 80px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:900px;margin:0 auto;padding:0 28px}
.hero{background:var(--ink);color:#fff;padding:44px 0 36px;border-bottom:6px solid var(--teal)}
.hero h1{font:800 clamp(30px,5vw,50px)/1.05 var(--ui);margin:0 0 10px;letter-spacing:-.02em}
.hero p{margin:0 0 22px;color:#c9d5e6;max-width:60ch;font-family:var(--ui);font-size:16px}
.bitrow{display:flex;gap:6px;flex-wrap:wrap}
.hero .tg{background:#22355a;color:#fff;border-color:#5b7098}
.hero .tg.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
.readouts div{border-top:2px solid #5b7098;padding-top:6px;font-family:var(--ui);font-size:12.5px;color:#a9b9d3}
.readouts b{display:block;font:600 22px var(--mono);color:#fff;letter-spacing:.02em;word-break:break-all}
section.ch{padding:56px 0 8px;scroll-margin-top:0}
section.ch>.wrap>h2{font:800 32px/1.15 var(--ui);margin:0 0 6px;letter-spacing:-.01em}
section.ch>.wrap>h2 i{font:500 15px var(--mono);color:var(--teal);margin-right:12px;font-style:normal}
h3{font:700 20px/1.3 var(--ui);margin:34px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
h4{font:700 16px var(--ui);margin:22px 0 4px;color:var(--teal)}
p{margin:.55em 0}
ul{padding-left:1.25em;margin:.5em 0}li{margin:.2em 0}
.lead{font-size:18.5px;color:#26354f}
code,.m{font-family:var(--mono);font-size:.9em}
.n{text-decoration:overline;text-decoration-thickness:1.5px}
.tool{background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;box-shadow:5px 5px 0 var(--teal2);margin:18px 0;font-family:var(--ui);font-size:15px;line-height:1.5}
.tool>.th{background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;padding:6px 14px;border-radius:2px 2px 0 0}
.tool>.tb{padding:14px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tabs button,.btn,select,input[type=text]{font:600 14px var(--ui);border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:6px 11px;border-radius:3px;cursor:pointer}
input[type=text]{cursor:text;font-family:var(--mono);font-weight:500;font-size:15px;min-width:0}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.btn:hover,.tabs button:hover{background:var(--teal2)}.tabs button[aria-selected=true]:hover{background:var(--ink)}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.row label{font-weight:600;font-size:13.5px;color:var(--ink2)}
.tg{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:58px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:4px;cursor:pointer;font-family:var(--mono);padding:2px 4px}
.tg small{font:600 10.5px var(--ui);opacity:.75}.tg b{font-size:21px;line-height:1.1}
.tg.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.led{display:inline-block;width:16px;height:16px;border-radius:50%;background:#d4dcd7;border:1.5px solid #95a39b;vertical-align:-3px}
.led.on{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 3px var(--teal2)}
.out{display:inline-flex;align-items:center;gap:7px;font:600 15px var(--mono);margin-right:14px}
table.t{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin:8px 0}
table.t th,table.t td{border:1.2px solid var(--line);padding:4px 10px;text-align:center}
table.t th{background:#e8efe9;font-family:var(--ui);font-weight:700;font-size:13px}
table.t td.l,table.t th.l{text-align:left}
table.t tr.hi td{background:var(--amber2);font-weight:700}
table.t td.ok{color:var(--teal);font-weight:700}
.scroll{overflow-x:auto}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.res button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:3px;padding:6px 10px;cursor:pointer;font-family:var(--ui)}
.res button.sel{border-color:var(--teal);background:var(--teal2)}
.res small{display:block;color:var(--ink2);font-size:12px}.res b{font:600 16px var(--mono);word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1.2px solid var(--ink);border-radius:3px;padding:2px 8px;font:600 14px var(--mono);background:#fff;text-align:center}
.chip small{display:block;font:500 11px var(--ui);color:var(--ink2)}
.chip.o{background:var(--amber2);border-color:var(--amber)}
.note,.fix,.key,.eg{padding:10px 14px;margin:14px 0;border-left:4px solid;font-size:15.5px;font-family:var(--ui);line-height:1.55}
.note{background:var(--blue2);border-color:var(--blue)}.fix{background:var(--red2);border-color:var(--red)}
.key{background:var(--teal2);border-color:var(--teal)}.eg{background:var(--amber2);border-color:var(--amber)}
.note b:first-child,.fix b:first-child,.key b:first-child,.eg b:first-child{margin-right:4px}
pre.w{font:500 14.5px/1.5 var(--mono);margin:8px 0;white-space:pre;overflow-x:auto}
svg{max-width:100%;height:auto}
svg text{font-family:var(--ui)}
.w{fill:none;stroke:#9aa8a1;stroke-width:2.4;stroke-linejoin:round}.w.on{stroke:var(--teal)}
.g{fill:#fff;stroke:var(--ink);stroke-width:2}
.pin{font:700 12px var(--ui);fill:var(--ink)}
.dot{fill:#9aa8a1}.dot.on{fill:var(--teal)}
.kmap{border-collapse:separate;border-spacing:0;font-family:var(--mono)}
.kmap td,.kmap th{width:62px;height:58px;border:1.5px solid var(--ink);text-align:center;padding:0;position:relative}
.kmap th{background:#e8efe9;width:auto;height:auto;font:700 13px var(--mono);padding:4px 8px;border-width:1.5px}
.kmap th.corner{background:#fff;border:none;font-size:12px;text-align:right}
.kmap button{all:unset;display:block;width:100%;height:100%;cursor:pointer;font:700 22px var(--mono);position:relative}
.kmap button small{position:absolute;right:4px;top:2px;font:500 10px var(--mono);color:#7b8a83}
.kmap button:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
.kmap td.hl{outline:4px solid var(--amber);outline-offset:-4px;z-index:2}
.kmap .dots{position:absolute;left:3px;bottom:3px;display:flex;gap:2px}
.kmap .dots i{width:9px;height:9px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.35)}
.kmap .v0{color:#9aa8a1;font-weight:500}.kmap .v1{color:var(--ink)}.kmap .vx{color:var(--amber)}
.leg{list-style:none;padding:0;margin:8px 0;font-family:var(--ui)}
.leg li{display:flex;gap:10px;align-items:center;padding:4px 6px;border-radius:3px;cursor:default}
.leg li:hover{background:var(--amber2)}
.leg i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.35)}
.big{font:700 22px var(--mono);padding:8px 12px;background:var(--teal2);border-left:4px solid var(--teal);margin:8px 0;overflow-x:auto}
.fam ul{list-style:none;padding-left:1.1em;border-left:2px solid var(--ink);margin:2px 0 2px .4em}
.fam>ul{border:0;padding:0;margin:0}.fam li{margin:4px 0;font-family:var(--ui);font-size:15px}
.fam li b{background:var(--ink);color:#fff;padding:1px 9px;border-radius:3px;font-size:14px}
.fam li.leaf b{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.msg{font-weight:700;color:var(--red);min-height:1.4em}
.mini{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.mini figure{margin:0;text-align:center;font:13px var(--ui);color:var(--ink2)}
.ff{display:flex;gap:6px;margin:10px 0}
.ffb{border:2px solid var(--ink);min-width:62px;text-align:center;padding:6px 4px;background:#fff;font-family:var(--mono);border-radius:3px;transition:background .15s}
.ffb small{display:block;font:600 11px var(--ui);color:var(--ink2)}.ffb b{font-size:26px}
.ffb.on{background:var(--teal);color:#fff;border-color:var(--teal)}.ffb.on small{color:#d8f1ea}
.ffb.flash{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.menu-btn{display:none}
.kmap.sm td{width:44px;height:42px}.kmap.sm button{font-size:16px}.kmap.sm th{font-size:11px;padding:2px 5px}.kmap.sm button small{font-size:8.5px}
.menu-btn{display:none}
@media (max-width:980px){
 nav#nav{position:fixed;inset:0 0 auto 0;width:auto;height:auto;max-height:100vh;overflow:visible;padding:0;border-right:0;border-bottom:1.5px solid var(--ink);display:block}
 nav#nav .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px 6px 14px;margin:0;border-bottom:0;font-size:15px}
 nav#nav .brand small{display:none}
 .menu-btn{display:inline-flex;align-items:center;gap:8px;font:700 14px var(--ui);background:var(--ink);color:#fff;border:0;border-radius:3px;padding:9px 13px;min-height:40px;cursor:pointer}
 #navlist{display:none;max-height:calc(100vh - 58px);overflow-y:auto;border-top:1.5px solid var(--ink);background:#fff;-webkit-overflow-scrolling:touch}
 nav#nav.open #navlist{display:block}
 nav#nav a{padding:13px 18px;border-bottom:1px solid #e3e9e4;font-size:16px}
 main{margin-left:0;padding-top:52px}.wrap{padding:0 16px}
 section.ch{scroll-margin-top:56px}
 .kmap td{width:50px;height:50px}
 .hero{padding-top:28px}
}
@media print{nav#nav{display:none}main{margin:0}.tool{break-inside:avoid}}
.home-link{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;font:700 13px var(--ui);color:var(--teal);background:var(--teal2);border:1.5px solid var(--teal);border-radius:3px;text-decoration:none;transition:all .2s;margin-left:auto;}
.home-link:hover{background:var(--teal);color:#fff;}
.null{color:#9aa8a1;font-style:italic}
td.bad{background:var(--red2)!important;color:var(--red);font-weight:700}td.good{background:var(--teal2)!important}
td.lock{background:var(--amber2)!important}
textarea.sql{width:100%;min-height:150px;font:500 14.5px/1.5 var(--mono);border:1.5px solid var(--ink);border-radius:3px;padding:10px;resize:vertical;background:#fbfcfb;color:var(--ink)}
.err{background:var(--red2);border-left:4px solid var(--red);padding:8px 12px;margin:8px 0;font:600 14px var(--mono);white-space:pre-wrap}
.okm{background:var(--teal2);border-left:4px solid var(--teal);padding:8px 12px;margin:8px 0;font:600 14px var(--ui)}
pre.code{background:#f1f4f2;border:1px solid var(--line);border-left:4px solid var(--ink);padding:10px 12px;margin:8px 0;font:500 13.5px/1.55 var(--mono);overflow-x:auto;white-space:pre}
details.acc{border:1.5px solid var(--ink);border-radius:3px;margin:8px 0;background:#fff;font-family:var(--ui)}
details.acc>summary{cursor:pointer;padding:9px 14px;font-weight:700;font-size:15px;list-style:none}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::before{content:'+';display:inline-block;width:20px;color:var(--teal);font-family:var(--mono)}
details.acc[open]>summary::before{content:'−'}
details.acc[open]>summary{background:var(--teal2);border-bottom:1.5px solid var(--ink)}
details.acc>div{padding:8px 16px 12px;font-size:15px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cols2>div{min-width:0}
.pill{display:inline-block;padding:1px 9px;border-radius:12px;font:700 12px var(--ui);background:var(--ink);color:#fff;margin:0 4px 2px 0}
.pill.g{background:var(--teal)}.pill.r{background:var(--red)}.pill.a{background:var(--amber);color:var(--ink)}
.sel{cursor:pointer}.sel:hover td{background:var(--amber2)}
tr.pick td{background:var(--teal2)!important;font-weight:700}
.stepbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stepbar span{padding:4px 11px;border:1.5px solid var(--line);border-radius:14px;font:600 13px var(--ui);color:var(--ink2)}
.stepbar span.on{background:var(--teal);border-color:var(--teal);color:#fff}
.hero .tg{min-width:auto;height:46px;padding:0 14px;flex-direction:row;font:700 15px var(--ui)}
.hero .arrowx{color:#5b7098;align-self:center;font-weight:700}
.heroTxt{margin-top:16px;min-height:3.2em;font-family:var(--ui);color:#e3ebf7;font-size:16px;max-width:62ch}
</style>

<body>
<nav id="nav" aria-label="Chapters"></nav>
<main id="main"></main>
<script>
/* ===== Mini SQL engine (teaching subset) ===== */
function sqlTok(s){
  const out=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(c==='-'&&s[i+1]==='-'){while(i<s.length&&s[i]!=='\n')i++;continue;}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;out.push({t:'num',v:parseFloat(s.slice(i,j)),x:s.slice(i,j)});i=j;continue;}
    if(c==="'"){let j=i+1,v='';while(j<s.length){if(s[j]==="'"){if(s[j+1]==="'"){v+="'";j+=2;continue;}break;}v+=s[j++];}out.push({t:'str',v,x:"'"+v+"'"});i=j+1;continue;}
    if(/[A-Za-z_]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z0-9_$#]/.test(s[j]))j++;const w=s.slice(i,j);out.push({t:'id',v:w,u:w.toUpperCase(),x:w});i=j;continue;}
    const two=s.substr(i,2);
    if(['<=','>=','<>','!=','||'].includes(two)){out.push({t:'op',v:two,x:two});i+=2;continue;}
    out.push({t:'op',v:c,x:c});i++;
  }
  return out;
}
const AGG=['COUNT','SUM','AVG','MIN','MAX'];
class P_{
  constructor(t){this.t=t;this.i=0;}
  peek(o=0){return this.t[this.i+o];}
  next(){return this.t[this.i++];}
  isK(u,o=0){const x=this.peek(o);return x&&x.t==='id'&&x.u===u;}
  isOp(v,o=0){const x=this.peek(o);return x&&x.t==='op'&&x.v===v;}
  acceptK(u){if(this.isK(u)){this.i++;return true;}return false;}
  acceptOp(v){if(this.isOp(v)){this.i++;return true;}return false;}
  expK(u){if(!this.acceptK(u))throw Error(`Expected ${u} near "${this.peek()?this.peek().x:'end'}"`);}
  expOp(v){if(!this.acceptOp(v))throw Error(`Expected "${v}" near "${this.peek()?this.peek().x:'end of statement'}"`);}
  ident(){const x=this.next();if(!x||x.t!=='id')throw Error('Expected a name near "'+(x?x.x:'end')+'"');return x.v;}
  or(){let a=this.and();while(this.acceptK('OR'))a={k:'bin',op:'OR',a,b:this.and()};return a;}
  and(){let a=this.not();while(this.acceptK('AND'))a={k:'bin',op:'AND',a,b:this.not()};return a;}
  not(){if(this.acceptK('NOT'))return {k:'not',a:this.not()};return this.cmp();}
  cmp(){
    let a=this.add();
    const x=this.peek();if(!x)return a;
    if(x.t==='op'&&['=','<>','!=','<','>','<=','>='].includes(x.v)){this.i++;return {k:'bin',op:x.v==='!='?'<>':x.v,a,b:this.add()};}
    let neg=false;
    if(this.isK('NOT')&&(this.isK('LIKE',1)||this.isK('IN',1)||this.isK('BETWEEN',1))){this.i++;neg=true;}
    if(this.acceptK('LIKE'))return {k:'like',a,p:this.add(),neg};
    if(this.acceptK('IN')){this.expOp('(');const l=[this.or()];while(this.acceptOp(','))l.push(this.or());this.expOp(')');return {k:'in',a,l,neg};}
    if(this.acceptK('BETWEEN')){const lo=this.add();this.expK('AND');const hi=this.add();return {k:'btw',a,lo,hi,neg};}
    if(this.acceptK('IS')){const n=this.acceptK('NOT');this.expK('NULL');return {k:'isnull',a,neg:n};}
    return a;
  }
  add(){let a=this.mul();for(;;){const x=this.peek();if(x&&x.t==='op'&&['+','-','||'].includes(x.v)){this.i++;a={k:'bin',op:x.v,a,b:this.mul()};}else break;}return a;}
  mul(){let a=this.un();for(;;){const x=this.peek();if(x&&x.t==='op'&&['*','/'].includes(x.v)){this.i++;a={k:'bin',op:x.v,a,b:this.un()};}else break;}return a;}
  un(){if(this.acceptOp('-'))return {k:'bin',op:'-',a:{k:'lit',v:0},b:this.un()};return this.prim();}
  prim(){
    const x=this.next();if(!x)throw Error('Unexpected end of statement');
    if(x.t==='num'||x.t==='str')return {k:'lit',v:x.v};
    if(x.t==='op'&&x.v==='('){const e=this.or();this.expOp(')');return e;}
    if(x.t==='id'){
      if(x.u==='NULL')return {k:'lit',v:null};
      if(this.isOp('(')){this.i++;const fn={k:'fn',n:x.u,args:[],star:false,distinct:false};
        if(this.acceptOp('*'))fn.star=true;else if(!this.isOp(')')){if(this.acceptK('DISTINCT'))fn.distinct=true;fn.args.push(this.or());while(this.acceptOp(','))fn.args.push(this.or());}
        this.expOp(')');return fn;}
      if(this.isOp('.')){this.i++;const c=this.next();if(c.t==='op'&&c.v==='*')return {k:'star',t:x.v};return {k:'col',t:x.v,n:c.v};}
      return {k:'col',n:x.v};
    }
    throw Error(`Unexpected "${x.x}"`);
  }
}
const hasAgg=n=>n&&typeof n==='object'&&(n.k==='fn'&&AGG.includes(n.n)||Object.values(n).some(v=>Array.isArray(v)?v.some(hasAgg):hasAgg(v)));
const likeRe=p=>new RegExp('^'+String(p).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.')+'$','i');
const cmpV=(a,b)=>a===b?0:(typeof a==='number'&&typeof b==='number'?a-b:String(a)<String(b)?-1:1);
function ev(n,row,grp){
  switch(n.k){
    case 'lit':return n.v;
    case 'col':{const key=(n.t?n.t.toLowerCase()+'.':'')+n.n.toLowerCase();if(!(key in row))throw Error('Unknown column '+(n.t?n.t+'.':'')+n.n);return row[key];}
    case 'not':{const v=ev(n.a,row,grp);return v===null?null:!v;}
    case 'bin':{
      if(n.op==='AND'){const a=ev(n.a,row,grp);if(a===false)return false;const b=ev(n.b,row,grp);return b===false?false:(a===null||b===null)?null:true;}

  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=+b.dataset.k;draw(k);cb(k);};
  draw(start);cb(start);
}
function Toggles(el,labels,init,cb){
  let v=init.slice(),last=-1;
  const draw=()=>{el.innerHTML=labels.map((l,i)=>`<button class="tg ${v[i]?'on':''}" data-i="${i}" aria-pressed="${!!v[i]}"><small>${l}</small><b>${v[i]}</b></button>`).join('');
    if(last>=0){const b=el.querySelector(`[data-i="${last}"]`);b&&b.focus();}};
  el.classList.add('bitrow');
  el.onclick=e=>{const b=e.target.closest('.tg');if(!b)return;const i=+b.dataset.i;v[i]^=1;last=i;draw();cb(v);};
  draw();cb(v);return {get:()=>v,set:nv=>{v=nv.slice();draw();cb(v);}};
}
const cell=v=>v===null||v===undefined?'<span class="null">NULL</span>':esc(v);
function htmlTable(cols,rows,o={}){
  return `<div class="scroll"><table class="t"><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr class="${o.row&&o.row(r,i)||''}">${r.map((v,j)=>`<td class="${o.cell&&o.cell(v,i,j)||''}">${cell(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
const gotoId=id=>{const e=document.getElementById(id);e&&e.scrollIntoView({behavior:'smooth'});};
const svgBox=(x,y,w,h,label,on,sz=13)=>`<rect class="g" x="${x}" y="${y}" width="${w}" height="${h}" rx="3" style="${on?'fill:#d8f1ea;stroke:#0a8f7b;stroke-width:2.6':''}"/><text class="pin" x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" style="font-size:${sz}px">${label}</text>`;
const wire=(pts,on,dash)=>`<polyline class="w ${on?'on':''}" ${dash?'stroke-dasharray="5 4"':''} points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
const arrowHead=(x,y,dir,on)=>{const c=on?'#0a8f7b':'#9aa8a1';const p={d:`${x},${y} ${x-6},${y-9} ${x+6},${y-9}`,u:`${x},${y} ${x-6},${y+9} ${x+6},${y+9}`,r:`${x},${y} ${x-9},${y-6} ${x-9},${y+6}`,l:`${x},${y} ${x+9},${y-6} ${x+9},${y+6}`}[dir];return `<polygon points="${p}" fill="${c}"/>`;};
const SQLT=(t)=>`<span class="m">${esc(t)}</span>`;

/* ================= HERO ================= */
const HERO=[['Data','Raw facts or figures that are in an unorganised form and have no proper meaning — text, numbers, audio … e.g. 72, 85, 90, 64.'],
 ['Process','Various operations are performed on the data — sorting, calculating, organising.  e.g. add the numbers and divide by 4.'],
 ['Information','Data that has become meaningfully processed.  e.g. “Average marks = 77.75” — a table is information.'],
 ['Knowledge','Understanding drawn from information.  e.g. “The class is doing well, but one student is below 65.”'],
 ['Wisdom','Using knowledge to decide well.  e.g. “Give extra help to the weak student before the exam.”']];
function heroInit(){

  el.onclick=e=>{const b=e.target.closest('.tg');if(!b)return;cur=+b.dataset.i;draw();};draw();

/* ================= 1 DATA & DATABASE ================= */
section('data','Data, information & DBMS',`
<p class="lead">A <b>database</b> stores data; a <b>DBMS</b> is the software that manages it. Start with the idea of data itself.</p>
<ul><li><b>Data</b> — raw facts or figures in an unorganised form that have no proper meaning (text, number, audio …).</li><li><b>Information</b> — what data becomes when various operations are performed on it and it is meaningfully processed. Example: a table.</li></ul>
<div class="tool"><div class="th">Data → Process → Information → Knowledge → Wisdom</div><div class="tb">
<div class="row"><label for="dwIn">Raw data (marks)</label><input type="text" id="dwIn" value="72, 85, 90, 64" size="22"><button class="btn pri" id="dwGo">Next step</button><button class="btn" id="dwReset">Start again</button></div>
<div class="stepbar" id="dwBar"></div><div id="dwOut"></div></div></div>
<h3>Database</h3>
<ul><li>A database is a connection (collection) of <b>inter-related data</b>.</li><li>Types: <b>structured</b> and <b>unstructured</b>.</li></ul>
<div class="fam"><ul><li><b>Database system</b><ul><li><b>Database</b> — collection of data<ul><li class="leaf"><b>Structured</b> — Banking, Railways (RDBMS) → <b>TABLE</b></li><li class="leaf"><b>Unstructured</b> — websites</li></ul></li>
<li><b>DBMS</b> — a software used to manage database files; performs operations on the DB. e.g. Oracle, MySQL etc.</li></ul></li></ul></div>
<h3>DBMS</h3>
<ul><li>Acts as an <b>interface between the user and the DB file</b>.</li><li>Converts the user's request into a database query, sends it to the DB file, fetches the required data and returns the information to the user.</li><li>A collection of application software that enables communication between the user and the DB file.</li></ul>
<div class="tool"><div class="th">Follow a request through the DBMS</div><div class="tb"><div class="row"><button class="btn pri" id="fbGo">Send request</button><span id="fbMsg" class="m"></span></div>
<svg id="fbSvg" viewBox="0 0 560 250" width="560" role="img" aria-label="User, DBMS and DB file"></svg></div></div>
`,root=>{
  const ST=['Marks collected: <b>72, 85, 90, 64</b> — just numbers with no meaning yet. This is <b>data</b>.','<b>Process</b>: add the numbers, divide by how many there are, find the lowest.','<b>Information</b>: total = SUM, average = AVG, lowest = MIN — now it means something.','<b>Knowledge</b>: the class is doing well overall, but one student is far below the others.','<b>Wisdom</b>: arrange extra classes for the weak student before the exam.'];
  let s=0;const names=['Data','Process','Information','Knowledge','Wisdom'];
  const draw=()=>{$('#dwBar').innerHTML=names.map((n,i)=>`<span class="${i<=s?'on':''}">${n}</span>`).join('');
    const nums=$('#dwIn').value.split(/[ ,]+/).map(Number).filter(x=>!isNaN(x)&&x!=='');let o='';
    if(!nums.length){$('#dwOut').innerHTML='<p>Enter some numbers.</p>';return;}
    const sum=nums.reduce((a,b)=>a+b,0),avg=sum/nums.length,mn=Math.min(...nums);
    o+=`<p>${ST[Math.min(s,4)]}</p>`;
    if(s===2)o+=htmlTable(['Count','Total','Average','Lowest'],[[nums.length,sum,+avg.toFixed(2),mn]]);
    if(s===3)o+=`<p class="m">${avg>=75?'Class average is good':'Class average is low'}; ${nums.filter(x=>x<avg-10).length} student(s) are more than 10 marks below average.</p>`;
    $('#dwOut').innerHTML=o;};
  $('#dwGo').onclick=()=>{s=Math.min(4,s+1);draw();};$('#dwReset').onclick=()=>{s=0;draw();};$('#dwIn').oninput=draw;draw();
  let step=-1,timer=null;
  const fb=()=>{const on=i=>step>=i;let o='';
    o+=svgBox(210,10,140,44,'User',step===0)+svgBox(210,100,140,50,'DBMS',step>=1&&step<=3)+svgBox(210,196,140,44,'DB file',step===2||step===3);
    o+=wire([[280,54],[280,100]],step===0)+arrowHead(280,100,'d',step===0)+wire([[330,150],[330,196]],step===2)+arrowHead(330,196,'d',step===2)+wire([[300,196],[300,150]],step===3)+arrowHead(300,150,'u',step===3);
    o+=wire([[350,125],[430,125]],step>=1)+arrowHead(430,125,'r',step>=1)+`<text class="pin" x="436" y="122">Provides interface</text>`+wire([[210,125],[130,125]],step>=1)+arrowHead(130,125,'l',step>=1)+`<text class="pin" x="126" y="122" text-anchor="end">Application</text><text class="pin" x="126" y="136" text-anchor="end">software</text>`;
    o+=wire([[260,100],[260,54]],step===4)+arrowHead(260,54,'u',step===4);
    $('#fbSvg').innerHTML=o;
    const M=['1. The user asks for data.','2. The DBMS converts the request into a database query.','3. The query is sent to the DB file and the required data is fetched.','4. The data comes back to the DBMS.','5. The DBMS returns the information to the user.'];
    $('#fbMsg').textContent=step>=0?M[step]:'Press “Send request”.';};
  $('#fbGo').onclick=()=>{clearInterval(timer);step=0;fb();timer=setInterval(()=>{step++;fb();if(step>=4)clearInterval(timer);},950);};fb();
});

/* ================= 2 FILE SYSTEM vs DBMS ================= */
section('fs','File system vs DBMS',`
<h3>File system</h3>
<ul><li>Manages the various files in a computer; managed by the OS. Used for small files.</li></ul>
<div class="scroll"><table class="t"><tr><th class="l">Type</th><th class="l">Details</th></tr><tr><td class="l"><b>FAT</b> — File Allocation Table</td><td class="l">Basic.</td></tr><tr><td class="l"><b>NTFS</b> — New Technology File System</td><td class="l">Main file (Master File System); made for the Windows NT kernel (1993).</td></tr></table></div>
<h3>Difference between file system and DBMS</h3>
<div class="scroll"><table class="t"><tr><th class="l">Point</th><th class="l">File system</th><th class="l">DBMS</th></tr>
<tr><td class="l"><b>Data redundancy</b></td><td class="l">Same data gets repeated / duplicated in many files.</td><td class="l">No duplication.</td></tr>
<tr><td class="l"><b>Data inconsistency</b></td><td class="l">If data in one file is updated, other files are not updated automatically, so data becomes inconsistent.</td><td class="l">Data remains consistent and accurate.</td></tr>
<tr><td class="l"><b>Security</b></td><td class="l">Hard to give different users different types of access.</td><td class="l">Advanced security; different permissions for multiple users.</td></tr>
<tr><td class="l"><b>Concurrency</b></td><td class="l">Multiple users cannot reliably access the same file at the same time.</td><td class="l">Multiple users can access the same data / file at the same time, safely.</td></tr></table></div>
<h4>Redundancy and inconsistency — try it</h4>
<div class="tool"><div class="th">Change a student's phone number</div><div class="tb"><div class="row"><label for="fiPh">New phone</label><input type="text" id="fiPh" value="9999" size="8"></div>
<div class="cols2"><div><b>File system</b> — the same data copied into 3 files<div id="fsFiles"></div><p class="msg" id="fsMsg"></p></div>
<div><b>DBMS</b> — one table, no copies<div id="dbTab"></div><div class="row"><button class="btn pri" id="dbUp">UPDATE phone</button><button class="btn" id="fiReset">Reset both</button></div><p id="dbMsg" class="m"></p></div></div></div></div>
<h4>Concurrency level</h4>
<ul><li><b>File system:</b> concurrency is at the <b>file / resource level</b> — while one user uses a file, nobody else can use it.</li><li><b>DBMS:</b> concurrency is at the <b>row / record level</b> — only the row being used is locked; every other row stays available.</li></ul>
<div class="tool"><div class="th">Two users, one table</div><div class="tb"><div class="tabs" id="ccMode"></div>
<div class="row"><label>User A works on row</label><span id="ccA"></span></div><div class="row"><label>User B works on row</label><span id="ccB"></span></div><div id="ccTab"></div><p id="ccMsg" class="msg" style="color:var(--ink)"></p></div></div>
<h4>Different levels of access — views</h4>
<ul><li><b>File system:</b> to give different access you need separate physical files.</li><li><b>DBMS:</b> different <b>views</b> are created. A VIEW = <b>virtual table</b>: it performs operations on the underlying master table, does <b>not physically store data</b>, and only looks like the original table.</li></ul>
<div class="tool"><div class="th">One master table, different views</div><div class="tb"><div class="row"><label for="vwRole">Log in as</label><select id="vwRole"><option>Clerk</option><option>Manager</option><option>Auditor (CS dept only)</option></select></div>
<p style="margin:0 0 4px"><b>Master table Employee</b> (stored once)</p><div id="vwMaster"></div><p style="margin:8px 0 4px"><b>What this user sees</b> (a view)</p><div id="vwView"></div><pre class="code" id="vwSql"></pre></div></div>
<h4>Data access cost</h4>
<ul><li><b>File system:</b> bringing data from secondary memory to primary memory is costly because the <b>entire file must be opened</b>.</li><li><b>DBMS:</b> <b>indexing</b> is used, so the cost is low.</li></ul>
<div class="tool"><div class="th">Find a record among 1000</div><div class="tb"><div class="row"><label for="ixId">Record id</label><input type="text" id="ixId" value="737" size="6"><button class="btn pri" id="ixGo">Search</button></div><div id="ixOut"></div></div></div>
<div class="key"><b>Remember.</b> In a DBMS a user can access data without knowing the internal details — only the specific row, table or column they need.</div>
`,root=>{
  /* redundancy */
  let files,dbPhone;const reset=()=>{files={Library:'1111',Accounts:'1111',Exam:'1111'};dbPhone='1111';draw();};
  const draw=()=>{
    $('#fsFiles').innerHTML=Object.keys(files).map(f=>`<div class="row" style="margin:4px 0"><span class="pill">${f}.txt</span><span class="m">Asha, phone ${files[f]}</span><button class="btn" data-f="${f}">Update here</button></div>`).join('');
    const vals=Object.values(files),bad=new Set(vals).size>1;$('#fsMsg').textContent=bad?'Inconsistent! The same student now has different phone numbers in different files.':'';
    $('#dbTab').innerHTML=htmlTable(['Id','Name','Phone'],[[1,'Asha',dbPhone]]);
  };
  $('#fsFiles').onclick=e=>{const b=e.target.closest('button');if(!b)return;files[b.dataset.f]=$('#fiPh').value;draw();};
  $('#dbUp').onclick=()=>{dbPhone=$('#fiPh').value;draw();$('#dbMsg').textContent='Updated in one place — every user and every view sees the new value.';};
  $('#fiReset').onclick=()=>{$('#dbMsg').textContent='';reset();};reset();
  /* concurrency */
  let mode=0,a=-1,b=-1;
  const rows=['Row 1  Asha','Row 2  Ravi','Row 3  Seeta','Row 4  Meena'];
  const pick=(id,who)=>{$(id).innerHTML=['—',1,2,3,4].map((n,i)=>`<button class="btn" data-w="${who}" data-n="${i-1}" ${(who==='A'?a:b)===i-1?'style="background:var(--teal);color:#fff"':''}>${n}</button>`).join(' ');};
  const cc=()=>{pick('#ccA','A');pick('#ccB','B');
    let blockedB=false;if(a>=0&&b>=0)blockedB=mode===0||a===b;
    $('#ccTab').innerHTML=htmlTable(['Row','A holds','B holds'],rows.map((r,i)=>[r,a===i?'LOCK':'',b===i?(blockedB?'WAITING':'LOCK'):'']),{cell:(v,i,j)=>(v==='LOCK'?'lock':v==='WAITING'?'bad':'')});
    $('#ccMsg').innerHTML=a<0||b<0?'Choose a row for both users.':blockedB?(mode===0?`File system: the <b>whole file</b> is locked by A, so B must wait even though B wants a different row.`:`DBMS: both want <b>row ${a+1}</b>, so B waits for that row.`):`DBMS: A and B work on different rows at the same time — no waiting.`;};
  Tabs($('#ccMode'),['File system (file-level lock)','DBMS (row-level lock)'],k=>{mode=k;cc();},0);
  ['#ccA','#ccB'].forEach(id=>$(id).onclick=e=>{const x=e.target.closest('button');if(!x)return;if(x.dataset.w==='A')a=+x.dataset.n;else b=+x.dataset.n;cc();});cc();
  /* views */
  const EMP=[[1,'Anil','CS',52000],[2,'Bina','CS',61000],[3,'Chetan','HR',45000],[4,'Deepa','Sales',48000]];
  const vw=()=>{const r=$('#vwRole').selectedIndex;$('#vwMaster').innerHTML=htmlTable(['Eid','EName','Dept','Salary'],EMP);
    const V=[[['EName','Dept'],EMP.map(x=>[x[1],x[2]]),'CREATE VIEW clerk_view AS\n  SELECT EName, Dept FROM Employee;'],[['Eid','EName','Dept','Salary'],EMP,'CREATE VIEW manager_view AS\n  SELECT * FROM Employee;'],[['EName','Salary'],EMP.filter(x=>x[2]==='CS').map(x=>[x[1],x[3]]),"CREATE VIEW auditor_view AS\n  SELECT EName, Salary FROM Employee\n  WHERE Dept = 'CS';"]][r];
    $('#vwView').innerHTML=htmlTable(V[0],V[1]);$('#vwSql').textContent=V[2];};
  $('#vwRole').onchange=vw;vw();
  /* index */
  $('#ixGo').onclick=()=>{const id=+$('#ixId').value;if(!(id>=1&&id<=1000)){$('#ixOut').innerHTML='<p class="msg">Enter a number from 1 to 1000.</p>';return;}
    let lo=1,hi=1000,steps=0;while(lo<=hi){steps++;const m=(lo+hi)>>1;if(m===id)break;if(m<id)lo=m+1;else hi=m-1;}
    $('#ixOut').innerHTML=`<div class="cols2"><div><b>File system</b> (open the whole file, read until found)<div class="big">${id} records read</div></div><div><b>DBMS with an index</b> (jump straight to it)<div class="big">${steps} index steps</div></div></div>`;};
  $('#ixGo').click();
});

/* ================= 3 ARCHITECTURE ================= */
section('arch','DBMS architecture',`
<p class="lead">How do clients reach the database? Either directly (two-tier) or through an application layer (three-tier).</p>
<div class="tool"><div class="th">Architecture explorer</div><div class="tb"><div id="arTabs"></div><div class="row"><button class="btn pri" id="arGo">Send a request</button><span class="m" id="arMsg"></span></div>
<svg id="arSvg" viewBox="0 0 560 270" width="560" role="img" aria-label="Architecture diagram"></svg><div id="arNotes"></div></div></div>
<div class="scroll"><table class="t"><tr><th></th><th class="l">Two-tier</th><th class="l">Three-tier</th></tr><tr><td class="l">Client connects to</td><td class="l">The database server directly</td><td class="l">The application / business layer</td></tr><tr><td class="l">Users</td><td class="l">Limited number</td><td class="l">Many (most web apps)</td></tr><tr><td class="l">Security</td><td class="l">Less secure</td><td class="l">Better security</td></tr><tr><td class="l">Maintenance</td><td class="l">Easy to maintain</td><td class="l">—</td></tr></table></div>
`,root=>{
  let tier=0,step=-1,timer=null;
  const draw=()=>{let o='';const on=i=>step===i;
    const cl=[60,220,380];
    if(tier===0){
      cl.forEach((x,i)=>{o+=svgBox(x,10,100,40,'Client-'+(i+1),step===0&&i===0)+wire([[x+50,50],[280,150]],step===0&&i===0||step===2&&i===0);});
      o+=svgBox(185,150,190,46,'Database file / server',step===1||step===2);
      $('#arMsg').textContent=['1. Client-1 builds a database query itself and sends it straight to the server.','2. The server runs the query on the database file.','3. The result goes straight back to the client.'][Math.max(step,0)]||'Press “Send a request”.';
      if(step<0)$('#arMsg').textContent='Press “Send a request”.';
      $('#arNotes').innerHTML='<ul><li>The client connects <b>directly</b> to the database server — a <b>client–server</b> architecture.</li><li>Limited number of users; less secure, easy to maintain.</li><li>The process on the client is converted into a database query (often called a low-level language query) and sent to the server.</li></ul>';
    }else{
      cl.forEach((x,i)=>{o+=svgBox(x,10,100,40,'Client-'+(i+1),step===0&&i===0)+wire([[x+50,50],[280,110]],step===0&&i===0||step===3&&i===0);});
      o+=svgBox(170,110,220,44,'Application / Business layer',step===1||step===3)+wire([[280,154],[280,210]],step===2||step===3)+svgBox(210,210,140,46,'Database file',step===2);
      const M=['1. The client\'s request first goes to the application / business layer — never to the DB server.','2. The application layer converts the request into a low-level database query.','3. The application layer interacts with the DB server and fetches the data.','4. The result returns to the client through the application layer.'];
      $('#arMsg').textContent=step<0?'Press “Send a request”.':M[step];
      $('#arNotes').innerHTML='<ul><li>The client is <b>not directly connected</b> to the DB server.</li><li>The application layer acts as an <b>interface between client and server</b>, so clients never talk to the server directly → <b>better security</b>.</li><li>Used by most web apps (e.g. Facebook, Instagram, Amazon).</li></ul>';
    }
    $('#arSvg').innerHTML=o;};
  Tabs($('#arTabs'),['Two-tier (two-level)','Three-tier (three-level)'],k=>{tier=k;step=-1;clearInterval(timer);draw();});
  $('#arGo').onclick=()=>{clearInterval(timer);step=0;draw();const max=tier===0?2:3;timer=setInterval(()=>{step++;draw();if(step>=max)clearInterval(timer);},1100);};
});

/* ================= 4 SCHEMAS ================= */
section('schema','Three-level abstraction',`
<p class="lead">The database is described at three levels. Each level hides the details of the one below it.</p>
<div class="tool"><div class="th">Click a level</div><div class="tb"><div id="scTabs"></div><div id="scInfo"></div></div></div>
<div class="key"><b>Summary.</b> Physical schema = deals in storage of DB · Conceptual schema = deals in tables and their relationship · External schema = deals in the requirement of the user.</div>
<h3>Data independence</h3>
<ul><li><b>Logical data independence:</b> adding a column or changing relationships between tables does not change the end-user interface (view). It is independence between the view level and the conceptual level.</li><li><b>Physical data independence:</b> adding a new disk or moving data to another disk does not affect the tables and their relationships — independence between the conceptual and physical levels.</li></ul>
<div class="tool"><div class="th">Change one level, watch the others</div><div class="tb"><div class="row"><button class="btn pri" id="diCol">Add column Email (logical change)</button><button class="btn pri" id="diDisk">Move data to Disk 2 (physical change)</button><button class="btn" id="diReset">Reset</button></div>
<div class="cols2"><div><span class="pill g">External · view level</span><div id="diView"></div></div><div><span class="pill a">Conceptual · logical level</span><div id="diConc"></div></div><div><span class="pill">Physical · internal level</span><div id="diPhys"></div></div></div><p class="m" id="diMsg"></p></div></div>
<p style="font-size:14px;color:var(--ink2)">The notes' heading says “Data Dependence” but the content describes data <i>independence</i>.</p>
`,root=>{
  const L=[['External schema / view level',['Users are connected to the DB.','Each user gets a <b>different view / schema</b> according to need.','Conceptual and physical details are <b>hidden</b> from the user — which table stores the data, how it is related to other tables, and on which disk it lives.']],
    ['Conceptual schema / logical level',['Describes <b>what data</b> is stored in the database.','The overall design of the DB is made with this schema.','Based on it, tables are created and relationships between tables are defined.']],
    ['Physical schema / internal schema',['Shows <b>how the actual database files are stored</b> on storage devices.','Managed by the <b>DBA</b>; controls how data is placed on and retrieved from the disk.','Maintains the <b>data dictionary</b>; controls the internal working of the database.']]];
  Tabs($('#scTabs'),['External (view)','Conceptual (logical)','Physical (internal)'],k=>{$('#scInfo').innerHTML=`<h4 style="margin-top:4px">${L[k][0]}</h4><ul>${L[k][1].map(x=>`<li>${x}</li>`).join('')}</ul>`;});
  let conc,disk,msg;const rs=()=>{conc=['Id','Name','Phone'];disk=1;msg='';dr();};
  const dr=()=>{$('#diView').innerHTML=htmlTable(['Name','Phone'],[['Asha','90011'],['Ravi','90022']]);
    $('#diConc').innerHTML=htmlTable(conc,[['1','Asha','90011',...(conc.length>3?['asha@x.in']:[])],['2','Ravi','90022',...(conc.length>3?['ravi@x.in']:[])]]);
    $('#diPhys').innerHTML=`<div class="big" style="font-size:17px">Student.dat on Disk ${disk}</div>`;$('#diMsg').textContent=msg;};

section('er','ER model & attributes',`
<p class="lead">In the entity–relationship model the database is drawn as a picture, showing its complete logical structure.</p>
<ul><li><b>Entity</b> — any object that has a physical appearance or exists physically. In a Student table, attributes like Rollno and Name describe the <b>Student entity set</b>; each individual student is an entity.</li><li><b>Relation</b> — connection of 2 entities. <b>Attributes</b> — characteristics of an entity.</li>
<li>The logical representation of data is the <b>schema</b>, e.g. <b>Student (Id, Name, Class, Phone)</b>; it shows things like table, primary key, foreign key, view.</li><li>The <b>instance</b> of a DB is the <b>snapshot</b> of the data at a particular moment.</li></ul>
<div class="tool"><div class="th">Schema stays, instance changes</div><div class="tb"><p class="m" style="margin:0">Schema: <b>Student (Id, Name, Class, Phone)</b></p><div class="row"><button class="btn pri" id="siAdd">Insert a student</button><button class="btn" id="siDel">Delete last student</button></div><p class="m" id="siSnap" style="margin:4px 0"></p><div id="siTab"></div></div></div>

<h3>Data dictionary</h3>
<ul><li>Data about data = <b>metadata</b>; stores additional information about data including storage and physical details.</li><li>Managed by the <b>DBMS itself</b>; stored in the DB's <b>table space</b> (the internal storage area where all tables are stored).</li></ul>
<h3>Types of attributes</h3>
<div class="scroll"><table class="t"><tr><th>#</th><th class="l">Type</th><th class="l">Meaning</th><th class="l">Example</th></tr>
<tr><td>1</td><td class="l"><b>Single-valued</b></td><td class="l">Carries a single value</td><td class="l">Roll no.</td></tr><tr><td>2</td><td class="l"><b>Multi-valued</b></td><td class="l">Carries multiple values</td><td class="l">Mobile no.</td></tr><tr><td>3</td><td class="l"><b>Simple</b></td><td class="l">Cannot be divided</td><td class="l">Registration no.</td></tr><tr><td>4</td><td class="l"><b>Composite</b></td><td class="l">Made of sub-parts</td><td class="l">Name (F-name, Last name)</td></tr>
<tr><td>5</td><td class="l"><b>Stored</b></td><td class="l">Attribute given to the table</td><td class="l">—</td></tr><tr><td>6</td><td class="l"><b>Derived</b></td><td class="l">Not kept in the table; calculated</td><td class="l">Age</td></tr><tr><td>7</td><td class="l"><b>Key</b></td><td class="l">Identifies a record uniquely</td><td class="l">Primary key</td></tr><tr><td>8</td><td class="l"><b>Non-key</b></td><td class="l">Does not identify uniquely</td><td class="l">Name, DoB</td></tr>
<tr><td>9</td><td class="l"><b>Complex</b></td><td class="l">Multivalued + composite</td><td class="l">Address</td></tr><tr><td>10</td><td class="l"><b>Required</b></td><td class="l">Compulsory (NOT NULL)</td><td class="l">—</td></tr><tr><td>11</td><td class="l"><b>Optional</b></td><td class="l">Not compulsory</td><td class="l">—</td></tr></table></div>
<div class="tool"><div class="th">Quiz — name the attribute type</div><div class="tb"><div id="qzList"></div><div class="row"><button class="btn pri" id="qzCheck">Check answers</button></div><p class="big" id="qzOut" style="font-size:16px"></p></div></div>
`,root=>{

section('keys','Keys',`
<ul><li>Keys <b>uniquely identify</b> each record / table. According to <b>E.F. Codd's Rule 1</b> two records of a table cannot be identical.</li><li>A key can be formed from <b>one or more attributes</b>.</li></ul>
<h3>Candidate, primary, alternate and super keys</h3>
<ul><li><b>Super key</b> — a set of attributes that can uniquely identify a record. Every candidate key is a super key, but not every super key is a candidate key (it may carry extra, unnecessary attributes).</li>
<li><b>Candidate key</b> — the <b>minimum</b> super key; values always unique and NOT NULL; can be simple or composite. A table can have several.</li>
<li><b>Primary key</b> — the one candidate key chosen; unique and not null; a table has <b>only one</b>.</li><li><b>Alternate (secondary) key</b> — every candidate key except the chosen primary key.</li>
<li><b>Prime / key attributes</b> — attributes that appear in some candidate key; the rest are non-prime.  e.g. R(A,B,C,D,E) with candidate keys (A, BC, E) → prime attributes A, B, C, E; D is non-prime.</li><li><b>Composite key</b> — a key that uses more than one column.</li></ul>
<div class="tool"><div class="th">Key finder — pick attributes, test the key</div><div class="tb"><div id="kfTab"></div><p style="margin:8px 0 4px">Tick the attributes to test:</p><div id="kfT"></div><div id="kfOut"></div>
<div class="row"><label for="kfPk">Choose the primary key</label><select id="kfPk"></select></div><div id="kfRes"></div></div></div>
<p>Super key ⊃ candidate key ⊃ primary key (the circles in the notes' diagram).</p>
<h3>Master capsule — counting super keys</h3>
<p>n = number of attributes in the relation.</p>
<div class="scroll"><table class="t"><tr><th class="l">Case</th><th class="l">Number of super keys</th></tr><tr><td class="l">One candidate key, a single attribute (A)</td><td class="l">2<sup>n−1</sup></td></tr><tr><td class="l">Two candidate keys, each a single attribute (A and B)</td><td class="l">2<sup>n−1</sup> + 2<sup>n−1</sup> − 2<sup>n−2</sup></td></tr><tr><td class="l">One candidate key made of two attributes (AB)</td><td class="l">2<sup>n−2</sup></td></tr></table></div>
<div class="tool"><div class="th">Super-key counter (formula and brute force)</div><div class="tb"><div class="row"><label for="scN">n</label><select id="scN">${[3,4,5,6,7,8].map(n=>`<option ${n===4?'selected':''}>${n}</option>`).join('')}</select><label for="scC">Candidate key(s)</label><select id="scC"><option value="1">A</option><option value="2">A and B</option><option value="3">AB (one composite key)</option><option value="4">all attributes (ABCD…)</option></select></div><div id="scOut"></div>

<h3>Foreign / reference key</h3>
<ul><li>The <b>primary key of one table used as a column in another table</b>. It can be NULL and need not be unique. The <b>referenced (parent)</b> table holds the primary key; the <b>referencing (child)</b> table holds the foreign key.</li></ul>

/* ================= 9 CODD ================= */
const CODD=[['Rule Zero — Foundation / base rule',['For a system to be called an <b>RDBMS</b>, it must qualify as a relational database management system.','It must use its relational capabilities to manage the database.']],
 ['Rule One — Information rule',['All information in a database must be represented in <b>one and only one way</b>, as values in a table (rows and columns).']],
 ['Rule Two — Guaranteed access rule',['The entire data in a database must be accessible.','Every table must have a <b>primary key</b>; data is logically reachable using it.']],
 ['Rule Three — Systematic treatment of NULL values',['Every field must be allowed to be null / empty.','NULL represents <b>missing, unknown or not-applicable</b> data.']],
 ['Rule Four — Active online catalogue based on the relational model',['Each system must have an online relational catalog.','It must be accessible to authorised users with the same regular query language they use for data.']],
 ['Rule Five — Data sublanguage rule',['Must provide at least one relational language to access data.','The language should support linear syntax, e.g. DDL, DML.']],
 ['Rule Six — View updating rule',['A view must be updatable.']],
 ['Rule Seven — High-level insert, delete and update rule',['Must support insert, delete and update through a high-level relational language.','Operations work on a <b>set of rows</b> (a retrieval set), not only a single row at a time.']],
 ['Rule Eight — Physical data independence',['A change in storage / disk must not affect the database tables or their relationships.']],
 ['Rule Nine — Logical data independence',['Modifications at the logical level must not affect the end-user\'s view.','Achieving logical data independence is difficult.']],
 ['Rule Ten — Integrity independence rule',['Integrity constraints must be stored in the <b>database catalog</b>, not inside the application program.','e.g. “phone is NOT NULL” is defined in the DB, so every inserted record must have a non-null phone.']],
 ['Rule Eleven — Distribution independence rule',['If data is distributed at various locations, this must be invisible to the DB user.']],
 ['Rule Twelve — Non-subversion rule',['Using any lower-level language you must not be able to ignore the integrity rules imposed by the DB language.','Constraints enforced by the DB language cannot be bypassed.']]];
section('codd','Codd\'s rules',`
<p class="lead">E.F. Codd defined <b>12 rules</b> (plus a base “Rule Zero”) that a database must follow to be called a relational DBMS.</p>
<div class="row"><label for="cdF">Filter</label><input type="text" id="cdF" placeholder="e.g. null, view, independence" size="30"></div>
<div id="cdAcc"></div>
<div class="tool"><div class="th">Which rule is it?</div><div class="tb"><div id="cqList"></div><div class="row"><button class="btn pri" id="cqCheck">Check</button></div><p class="big" id="cqOut" style="font-size:16px"></p></div></div>
<div class="note"><b>Note.</b> The handwritten pages number the rules (1)–(13) and cross out one duplicate “Rule Seven”; here they run Rule 0 to Rule 12.</div>
`,root=>{
  const draw=f=>{$('#cdAcc').innerHTML=CODD.filter(r=>!f||(r[0]+r[1].join(' ')).toLowerCase().includes(f.toLowerCase())).map(r=>`<details class="acc" ${f?'open':''}><summary>${r[0]}</summary><div><ul>${r[1].map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`).join('')||'<p>No rule matches.</p>';};
  $('#cdF').oninput=e=>draw(e.target.value);draw('');
  const Q=[['The “phone must not be NULL” constraint lives in the database, not in the app',10],['Moving the tables to a new disk must not change them or their relationships',8],['Unknown or missing values are stored as NULL',3],['One UPDATE statement must be able to change many rows at once',7],['Low-level code must not be able to bypass the database\'s constraints',12],['Every table has a primary key so any value can be reached',2],['If the DB is spread over several sites, the user must not notice',11]];
  $('#cqList').innerHTML=Q.map((q,i)=>`<div class="row"><span style="flex:1 1 300px">${q[0]}</span><select data-i="${i}"><option value="">choose…</option>${CODD.map((r,n)=>`<option value="${n}">Rule ${n} — ${r[0].split('— ')[1]}</option>`).join('')}</select><span id="cq${i}"></span></div>`).join('');
  $('#cqCheck').onclick=()=>{let ok=0;Q.forEach((q,i)=>{const v=$(`[data-i="${i}"]`,$('#cqList')).value;if(v!==''&&+v===q[1]){ok++;$('#cq'+i).innerHTML='<span class="pill g">✓</span>';}else $('#cq'+i).innerHTML=v!==''?'<span class="pill r">✗</span>':'';});$('#cqOut').textContent=`Score: ${ok} / ${Q.length}`;};
});
/* ================= 10 NORMALIZATION ================= */
function parseFDs(txt){return txt.split(/[\n;,]+/).map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.split(/->|→/);if(m.length!==2)throw Error(`Cannot read "${s}" — write it as  A -> B`);const L=[...new Set(m[0].toUpperCase().replace(/[^A-Z]/g,''))],R=[...new Set(m[1].toUpperCase().replace(/[^A-Z]/g,''))];if(!L.length||!R.length)throw Error(`Cannot read "${s}"`);return {L,R};});}
function closure(set,fds){const c=new Set(set);let ch=true;while(ch){ch=false;fds.forEach(f=>{if(f.L.every(x=>c.has(x))&&f.R.some(x=>!c.has(x))){f.R.forEach(x=>c.add(x));ch=true;}});}return c;}
function analyze(attrs,fds){
  const n=attrs.length,all=new Set(attrs),sup=[];
  for(let m=1;m<1<<n;m++){const s=attrs.filter((_,i)=>m>>i&1);if(closure(s,fds).size===n)sup.push(s);}
  const CK=sup.filter(c=>!sup.some(o=>o!==c&&o.length<c.length&&o.every(x=>c.includes(x))));
  const prime=new Set(CK.flat()),non=attrs.filter(a=>!prime.has(a));
  const isSuper=X=>closure(X,fds).size===n;
  const rows=[];let partial=false,trans=false,bcnf=true,nf3=true;
  fds.forEach(f=>{f.R.filter(a=>!f.L.includes(a)).forEach(a=>{
    const sp=isSuper(f.L),isPr=prime.has(a);
    const part=!sp&&!isPr&&CK.some(k=>f.L.every(x=>k.includes(x))&&f.L.length<k.length);
    const tr=!sp&&!isPr&&!part&&f.L.every(x=>!prime.has(x));
    if(part)partial=true;if(tr)trans=true;if(!sp)bcnf=false;if(!sp&&!isPr)nf3=false;
    rows.push({fd:f.L.join('')+' → '+a,lhsSuper:sp,rhsPrime:isPr,kind:part?'Partial dependency (part of a key → non-prime)':tr?'Transitive dependency (non-prime → non-prime)':sp?'LHS is a super key':'RHS is prime',ok2:!part,ok3:sp||isPr,okB:sp});});});
  const nf=partial?'1NF':!nf3?'2NF':!bcnf?'3NF':'BCNF';
  return {CK,prime:[...prime],non,rows,nf,partial,trans};
}
section('norm','Normalization',`
<p class="lead">Normalization <b>minimises data duplication / redundancy</b> in a table. Redundancy causes three kinds of problems — <b>anomalies</b> — and the cure is <b>decomposition</b> of the table.</p>
<div class="tool"><div class="th">Anomaly lab</div><div class="tb">
<div class="row"><button class="btn pri" id="anI">Insert: new course C4 with no student</button><button class="btn pri" id="anD">Delete student S4</button><button class="btn pri" id="anU1">Update teacher of C1 (one row only)</button><button class="btn pri" id="anU2">Update teacher of C1 (all rows)</button><button class="btn" id="anDec">Decompose the table</button><button class="btn" id="anR">Reset</button></div>
<div id="anMsg"></div><div id="anTab"></div></div></div>
<ul><li><b>Insert anomaly:</b> to record a course, Sid and Name must be filled with NULL or dummy values — more null / dummy data in the DB.</li><li><b>Delete anomaly:</b> deleting a record also deletes other related data (the course disappears with its last student).</li><li><b>Update anomaly:</b> updating a column means more than one related field has to be updated — miss one and the data is inconsistent.</li></ul>
<h3>1NF — First Normal Form</h3>
<ul><li>Every table should be in 1NF: each attribute holds only a <b>single value in each row</b> (no multivalued fields).</li><li>Three ways to convert: <b>repeat Rollno</b> (repeat the row), <b>repeat the column</b>, or <b>split the table</b>.</li></ul>
<div class="tool"><div class="th">Make this table 1NF</div><div class="tb"><div id="nfTabs"></div><div id="nfOut"></div></div></div>
<h4>1NF questions — the common-attribute rule</h4>
<p>If some attribute is <b>common to all candidate keys</b>, that attribute is multivalued and the relation is <b>not</b> in 1NF.</p>
<div class="tool"><div class="th">Common-attribute checker</div><div class="tb"><div class="row"><label for="ckIn">Candidate keys</label><input type="text" id="ckIn" value="PQ, PR, RST" size="26"><button class="btn" data-ck="PQ, PR, RST">Q1</button><button class="btn" data-ck="UV, VWX, VX, VY">Q2</button><button class="btn" data-ck="PR, PQ, RQ, ST, PST">Q3</button></div><div id="ckOut"></div></div></div>
<h3>2NF, 3NF and BCNF analyzer</h3>
<ul><li><b>2NF:</b> in 1NF and no <b>partial dependency</b> — a part of a candidate key (prime attribute) must not alone determine a non-prime attribute.</li><li><b>3NF:</b> in 2NF and no <b>transitive dependency</b> — a non-prime attribute must not determine another non-prime attribute.</li><li><b>BCNF:</b> in 3NF and the left side of every FD is a super key.</li></ul>
<div class="tool"><div class="th">Enter a relation and its functional dependencies</div><div class="tb">
<div class="row"><label for="nzA">Attributes</label><input type="text" id="nzA" size="14" value="ABCDEF"></div>
<div class="row"><label for="nzF" style="align-self:flex-start">FDs</label><textarea class="sql" id="nzF" style="min-height:70px;max-width:380px">C -> F
E -> A
EC -> D
A -> B</textarea></div>
<div class="row"><b style="font-size:13px">Load:</b><button class="btn" data-n="1">Notes: 2NF Q1</button><button class="btn" data-n="2">Notes: 2NF Q2</button><button class="btn" data-n="3">Notes: 3NF Q1</button><button class="btn" data-n="4">Notes: BCNF Q</button><button class="btn" data-n="5">Student–Course</button></div>

<h3>4NF and 5NF</h3>
<ul><li>4NF and 5NF are the highest levels of normalization. <b>4NF</b> controls <b>multivalued dependency</b>: a table has more than one independent multivalued attribute — you need at least three attributes, two independent ones that both depend on a third. Must be in BCNF; no multivalued dependency.</li><li><b>5NF (PJNF — Project-Join Normal Form):</b> already 4NF and no join dependencies. Decomposition must be <b>non-loss</b>: joining the split tables back must lose no data.</li></ul>

  const nz=()=>{try{const at=[...new Set($('#nzA').value.toUpperCase().replace(/[^A-Z]/g,''))];if(at.length<2||at.length>10)throw Error('Use 2 to 10 attributes (letters).');

      o+=`<p class="big">Highest normal form: ${r.nf}</p>`;
      o+='<h4>Attribute closures</h4>'+htmlTable(['X','X⁺ (everything X determines)'],fds.map(f=>[f.L.join(''),[...closure(f.L,fds)].sort().join('')]));

    {n:'The notes\' table',cols:['SID','SName','CID','CName'],rows:[['S1','A','C1','C'],['S2','A','C2','D'],['S3','B','C1','C'],['S4','B','C2','D']],split:[[0,1],[2,3]],note:'The notes split this into R1(SID, SName) and R2(CID, CName). Those two share <b>no common attribute</b>, so joining them can only form every pairing of rows — a lossless split needs a common attribute to join on.'}];

section('fd','Functional dependency',`
<p class="lead">A <b>functional dependency</b> is a relationship between attributes of a relation. If the same value of X always goes with the same value of Y, we write <b>X → Y</b>.</p>
<ul><li>From <b>Sid</b> we can uniquely identify <b>Name</b>, so Sid → Name; Sid is the <b>determinant</b>; Name is the <b>determined / dependent</b> attribute.</li><li>If the determinant's value is the same, the determined attribute's value is always the same. But if the determined attributes happen to match, the determinants need not.</li></ul>
<div class="tool"><div class="th">FD tester</div><div class="tb"><div id="fdTab"></div>
<div class="row"><span><b>X</b> (determinant)</span><span id="fdX"></span></div><div class="row"><span><b>Y</b> (determined)</span><span id="fdY"></span></div>
<div class="row"><b style="font-size:13px">Try:</b><button class="btn" data-fd="Sid|Name">Sid → Name</button><button class="btn" data-fd="Dept|Name">Dept → Name</button><button class="btn" data-fd="Sid,Name|Name">Sid, Name → Name</button><button class="btn" data-fd="Sid,Name|Sid,Age">Sid, Name → Sid, Age</button></div><div id="fdOut"></div></div></div>
<h3>Types of FD</h3>
<div class="scroll"><table class="t"><tr><th class="l">Type</th><th class="l">Rule</th><th class="l">Example</th></tr>
<tr><td class="l"><b>Trivial</b></td><td class="l">Y is a subset of X (X ⊇ Y). Every attribute determines itself.</td><td class="l">Sid → Sid;  Sid + Name → Name</td></tr>
<tr><td class="l"><b>Non-trivial</b></td><td class="l">X and Y have nothing in common (X ∩ Y = ∅); the determinant always determines a new attribute.</td><td class="l">Sid → S_Name</td></tr>
<tr><td class="l"><b>Semi-trivial</b></td><td class="l">Y is not a subset of X, but they share an attribute; reduces to a non-trivial FD.</td><td class="l">Sid + Sname → Sid + Sage  (≡ Sname → Sage)</td></tr></table></div>
<div class="note"><b>Clarification.</b> The notes write the non-trivial condition as “x ∩ y ≠ 0”; the standard condition (and the example Sid → S_Name) is X ∩ Y = ∅.</div>
`,root=>{
  const A=['Sid','Name','Age','Dept'],R=[[101,'N1',22,'CS'],[102,'N2',25,'CS'],[103,'N3',30,'IT'],[104,'N4',27,'HR']];
  $('#fdTab').innerHTML=htmlTable(A,R);let X=[1,0,0,0],Y=[0,1,0,0],tx,ty;
  const upd=()=>{const xi=A.map((_,i)=>i).filter(i=>X[i]),yi=A.map((_,i)=>i).filter(i=>Y[i]);if(!xi.length||!yi.length){$('#fdOut').innerHTML='<p class="msg" style="color:var(--ink2)">Choose attributes for X and Y.</p>';return;}
    const m=new Map();let holds=true,bad='';R.forEach(r=>{const kx=xi.map(i=>r[i]).join('|'),vy=yi.map(i=>r[i]).join('|');if(m.has(kx)&&m.get(kx)!==vy&&holds){holds=false;bad=`X = ${kx} appears with two different Y values (${m.get(kx)} and ${vy})`;}if(!m.has(kx))m.set(kx,vy);});
    const nx=xi.map(i=>A[i]),ny=yi.map(i=>A[i]),sub=ny.every(a=>nx.includes(a)),inter=ny.filter(a=>nx.includes(a));
    const type=sub?'Trivial (Y ⊆ X)':inter.length?'Semi-trivial (shared attribute, Y ⊄ X)':'Non-trivial (X ∩ Y = ∅)';
    $('#fdOut').innerHTML=`<p><b>${nx.join(', ')} → ${ny.join(', ')}</b></p><p>Type: <span class="pill a">${type}</span></p><p>In this sample data: ${holds?'<span class="pill g">the FD holds</span>':`<span class="pill r">does not hold</span> — ${bad}`}</p>${sub?'<p class="m" style="font-size:13.5px">A trivial FD always holds, whatever the data.</p>':'<p class="m" style="font-size:13.5px">A non-trivial FD is a rule of the data’s meaning; one sample can only disprove it, not prove it.</p>'}`;};
  tx=Toggles($('#fdX'),A,X,v=>{X=v.slice();upd();});ty=Toggles($('#fdY'),A,Y,v=>{Y=v.slice();upd();});
  $$('[data-fd]',root).forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.fd.split('|').map(s=>s.split(','));tx.set(A.map(a=>x.includes(a)?1:0));ty.set(A.map(a=>y.includes(a)?1:0));});
});

const SETUP=`CREATE TABLE Student (Rollno NUMBER(6), Name VARCHAR2(25), Class NUMBER(3), Age NUMBER(3), Fee NUMBER(8,2), City VARCHAR2(20), PRIMARY KEY (Rollno));
INSERT INTO Student VALUES (101,'Asha',11,16,12000,'Jaipur'),(102,'Ravi',11,17,15000,'Delhi'),(103,'Seeta',12,17,15000,'Jaipur'),(104,'Meena',12,18,18000,'Patna'),(105,'Kiran',11,16,12000,'Delhi'),(106,'Dev',12,17,15000,'Agra');
CREATE TABLE Dept (DeptId NUMBER(3) PRIMARY KEY, DName VARCHAR2(20));
INSERT INTO Dept VALUES (10,'IT'),(20,'HR'),(30,'Sales');
CREATE TABLE Employee (Eid NUMBER(4) PRIMARY KEY, EName VARCHAR2(20) NOT NULL, DeptId NUMBER(3), Salary NUMBER(8) DEFAULT 30000, FOREIGN KEY (DeptId) REFERENCES Dept(DeptId));
INSERT INTO Employee (Eid, EName, DeptId) VALUES (1,'Anil',10),(2,'Bina',10),(3,'Chetan',20),(4,'Deepa',NULL);
CREATE TABLE Dual (Dummy VARCHAR2(1));
INSERT INTO Dual VALUES ('X');
COMMIT;`;
function freshDB(){const d=new SQLDB();d.exec(SETUP);return d;}

<p style="font-size:13px;color:var(--ink2);margin:6px 0 0">Separate statements with <b>;</b>. COMMIT / ROLLBACK / SAVEPOINT work on every change here (including CREATE, ALTER and DROP). Supports CREATE, ALTER, DROP, TRUNCATE, INSERT, UPDATE, DELETE, SELECT (WHERE, GROUP BY, HAVING, ORDER BY, DISTINCT, joins), constraints, DESC, COMMIT, ROLLBACK, SAVEPOINT. <b>Dual</b> is a one-row helper table for trying functions.</p></div></div>
<h3>SQL command groups</h3>
<div class="fam"><ul><li><b>SQL commands</b><ul><li><b>DDL</b> — Create, Alter, Drop, Truncate</li><li><b>DML</b> — Select, Insert, Update, Delete</li><li><b>DCL</b> — Grant, Revoke</li><li><b>TCL</b> — Commit, Roll back, Save point</li><li><b>Constraints</b> — Primary key, Foreign key, Unique, Check, Default, Not null</li></ul></li></ul></div>

<h3>Data types</h3>

<h3>Structure of an SQL command</h3>
<p style="font-size:18px;line-height:2.1"><span class="pill">Select</span><span class="pill g">Name</span> <span style="border:2px dashed var(--red);padding:3px 4px;border-radius:4px;white-space:nowrap"><span class="pill">from</span><span class="pill g">Student</span></span> <span style="border:2px dashed var(--red);padding:3px 4px;border-radius:4px;white-space:nowrap"><span class="pill">where</span><span class="pill g">Rollno = 109</span></span></p>

<ul><li><b>AS</b> gives a result column a name — a “virtual column” used for the group.</li><li><b>HAVING</b> filters groups after grouping (WHERE filters rows before).</li><li><b>DISTINCT</b> eliminates duplicate records. The notes add “applies on first”; in standard SQL it applies to the whole combination of selected columns.</li><li>The notes write <code>DELETE Student where ID=101</code>; the standard form is <code>DELETE FROM Student WHERE …</code>.</li></ul>
<h3>SQL functions</h3>
<ul><li>Functions produce a result by manipulating the available data items; they are <b>group</b> or <b>scalar</b>.</li><li><b>Group functions</b> act on a set of values — an entire column goes in, a single value comes out: <b>AVG(), COUNT(), SUM(), MIN(), MAX()</b>.</li><li><b>Scalar functions</b> work on only one value.</li></ul>
<div class="scroll"><table class="t"><tr><th class="l">Category</th><th class="l">Functions</th><th></th></tr><tr><td class="l">Group</td><td class="l">AVG, COUNT, SUM, MIN, MAX</td><td><button class="btn" data-ex="grp">Try</button></td></tr><tr><td class="l">Numeric</td><td class="l">ABS(), SQRT(), POWER(), ROUND()</td><td><button class="btn" data-ex="num">Try</button></td></tr><tr><td class="l">String</td><td class="l">UPPER(), LOWER(), LENGTH(), LTRIM(), RTRIM(), SUBSTR()</td><td><button class="btn" data-ex="str">Try</button></td></tr><tr><td class="l">Date</td><td class="l">LAST_DAY(), NEXT_DAY(), MONTHS_BETWEEN()</td><td></td></tr><tr><td class="l">Conversion</td><td class="l">TO_NUMBER, TO_CHAR, TO_DATE</td><td></td></tr></table></div>

`,root=>{

   `<div class="scroll"><table class="t"><tr><th></th><th>DROP</th><th>TRUNCATE</th><th>DELETE</th></tr><tr><td class="l">Removes</td><td>Structure + data</td><td>All data</td><td>Selected rows (WHERE) or all</td></tr><tr><td class="l">Structure kept?</td><td>No</td><td>Yes</td><td>Yes</td></tr><tr><td class="l">Can be rolled back?</td><td>No (per notes)</td><td>No (per notes)</td><td>Yes, before COMMIT</td></tr></table></div><p style="font-size:13.5px;color:var(--ink2)">The playground rolls back everything (even DROP) so you can experiment; real Oracle-style DDL cannot be rolled back.</p>`;
  const CON=[['(A) NOT NULL','c_nn',['By default a column can hold NULL values.','When a column is defined NOT NULL it becomes <b>mandatory</b>.']],['(B) UNIQUE key','c_un',['Ensures that <b>no two rows have the same value</b> in the specified column.']],['(C) PRIMARY KEY','c_pk',['Identifies a record / row uniquely; by default the column is <b>Not Null and Unique</b>.']],['(D) FOREIGN KEY','c_fk',['Provides a relationship between two tables — hence the “reference key”. A foreign key is a primary key in another table.']],['(E) DEFAULT','c_df',['Sets a <b>default value</b> if no value is passed by the INSERT command.']],['(F) CHECK','c_ck',['Applies a <b>TRUE / FALSE condition</b>; only if it is true can the value be inserted.']],['(G) Table constraint vs column constraint','c_tb',['A constraint on a <b>single column</b> is a column constraint, written with the column definition.','A constraint on a <b>group of columns</b> is a table constraint, written at the end of CREATE TABLE.']]];
  $('#conDoc').innerHTML=CON.map(c=>`<details class="acc"><summary>${c[0]}</summary><div><ul>${c[2].map(x=>`<li>${x}</li>`).join('')}</ul><pre class="code">${esc(EX[c[1]])}</pre><button class="btn pri" data-ex="${c[1]}">Run this demo</button></div></details>`).join('');

/* ================= 13 TRANSACTIONS ================= */
function parseSched(t){const re=/([RW])\s*(\d+)\s*\(\s*(\w+)\s*\)/gi,ops=[];let m;while((m=re.exec(t)))ops.push({op:m[1].toUpperCase(),t:+m[2],x:m[3].toUpperCase()});return ops;}
section('txn','Serializability & locking',`
<h3>Serializability</h3>
<ul><li>Describes the <b>execution schema</b> of DB transactions: even if transactions are interleaved, the final result is the same as if they ran <b>one at a time in some serial order</b>.</li><li><b>Conflict serializability:</b> concurrently running transactions can be <b>rearranged</b> so their sequence becomes equivalent to a serial order.</li><li><b>View serializability:</b> they are <b>already equivalent</b> to a serial order, so there is no need to rearrange them.</li></ul>
<div class="tool"><div class="th">Conflict-serializability tester</div><div class="tb">
<div class="row"><label for="csIn">Schedule</label><input type="text" id="csIn" value="R1(A) W2(A) W1(A) R2(B)" size="40"><button class="btn" data-cs="R1(A) W1(A) R2(A) W2(A)">Serializable example</button><button class="btn" data-cs="R1(A) W2(A) W1(A)">Not serializable example</button></div>
<p style="font-size:13px;color:var(--ink2);margin:0">Write operations as R1(A) = transaction 1 reads A, W2(B) = transaction 2 writes B. Two operations <b>conflict</b> when they are from different transactions, touch the same item and at least one is a write.</p><div id="csOut"></div></div></div>
<h3>Two-phase locking (2PL)</h3>
<ul><li>A <b>concurrency control protocol</b> that ensures consistency during execution of transactions. Two phases:</li><li><b>Growing phase</b> — the transaction acquires locks on all required resources; it can take as many as it needs but <b>cannot release any lock yet</b>.</li><li><b>Shrinking phase</b> — it releases the locks; once it enters this phase it <b>cannot obtain any new lock</b>.</li></ul>
<div class="tool"><div class="th">2PL checker</div><div class="tb">
<div class="row"><label for="plIn">One transaction</label><input type="text" id="plIn" value="LX(A) LS(B) R(B) W(A) U(B) U(A)" size="44"></div>
<div class="row"><button class="btn" data-pl="LX(A) LS(B) R(B) W(A) U(B) U(A)">Valid 2PL</button><button class="btn" data-pl="LX(A) W(A) U(A) LX(B) W(B) U(B)">Breaks 2PL</button><button class="btn" data-pl="LX(A) LX(B) W(A) W(B) U(A) U(B)">Strict / rigorous</button><button class="btn" data-pl="LS(A) LX(B) R(A) W(B) U(A) U(B)">Conservative</button></div>
<p style="font-size:13px;color:var(--ink2);margin:0">LS(x) = shared lock, LX(x) = exclusive lock, U(x) = unlock, R(x) / W(x) = read / write.</p><div id="plOut"></div></div></div>
<div class="scroll"><table class="t"><tr><th class="l">Variation</th><th class="l">Rule</th></tr><tr><td class="l"><b>Strict 2PL</b></td><td class="l">Releases its <b>exclusive</b> locks only when it finishes.</td></tr><tr><td class="l"><b>Rigorous 2PL</b></td><td class="l">Releases <b>none</b> of its locks — neither shared nor exclusive — until it finishes.</td></tr><tr><td class="l"><b>Conservative 2PL</b></td><td class="l">Acquires <b>all</b> the locks it will need <b>before starting</b> execution, so the probability of deadlock is completely removed.</td></tr></table></div>
<p><b>Advantages of 2PL:</b> ensures serializability (data consistency is not violated) and helps with deadlock avoidance — the notes' wording; strictly, only conservative 2PL removes deadlock completely.</p>
<h3>Timestamp concurrency control</h3>
<ul><li>A <b>transaction ordering</b> method: when multiple transactions are ready to execute, each is given a <b>timestamp (T)</b>, which decides the order — and so the execution priority — of the transactions.</li></ul>
<div class="tool"><div class="th">Timestamp ordering</div><div class="tb"><div class="row"><button class="btn pri" data-t="1">Start T1</button><button class="btn pri" data-t="2">Start T2</button><button class="btn pri" data-t="3">Start T3</button><button class="btn" id="tsR">Reset</button></div><div id="tsOut"></div></div></div>
`,root=>{
  const cs=()=>{const ops=parseSched($('#csIn').value);if(!ops.length){$('#csOut').innerHTML='<p class="msg">Enter operations such as R1(A) W2(A).</p>';return;}
    const T=[...new Set(ops.map(o=>o.t))].sort(),E=new Map();
    for(let i=0;i<ops.length;i++)for(let j=i+1;j<ops.length;j++){const a=ops[i],b=ops[j];if(a.t!==b.t&&a.x===b.x&&(a.op==='W'||b.op==='W')){const k=a.t+'>'+b.t;if(!E.has(k))E.set(k,`${a.op}${a.t}(${a.x}) before ${b.op}${b.t}(${b.x})`);}}
    const adj={};T.forEach(t=>adj[t]=[]);[...E.keys()].forEach(k=>{const [a,b]=k.split('>').map(Number);adj[a].push(b);});
    const indeg={};T.forEach(t=>indeg[t]=0);T.forEach(t=>adj[t].forEach(u=>indeg[u]++));const q=T.filter(t=>!indeg[t]),order=[];
    while(q.length){const t=q.shift();order.push(t);adj[t].forEach(u=>{if(--indeg[u]===0)q.push(u);});}
    const ok=order.length===T.length;
    const R=100,cx=150,cy=130,pos={};T.forEach((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/T.length;pos[t]=[cx+R*Math.cos(a)*(T.length>1?1:0),cy+R*Math.sin(a)*(T.length>1?1:0)];});
    let svg='<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#c43d2f"/></marker></defs>';
    E.forEach((_,k)=>{const [a,b]=k.split('>').map(Number),A=pos[a],B=pos[b],dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy)||1,o=a<b?7:-7,ox=-dy/d*o,oy=dx/d*o;svg+=`<line x1="${A[0]+dx/d*24+ox}" y1="${A[1]+dy/d*24+oy}" x2="${B[0]-dx/d*27+ox}" y2="${B[1]-dy/d*27+oy}" stroke="#c43d2f" stroke-width="2.2" marker-end="url(#ah)"/>`;});
    T.forEach(t=>svg+=`<circle cx="${pos[t][0]}" cy="${pos[t][1]}" r="22" class="g" style="fill:#fff"/><text class="pin" x="${pos[t][0]}" y="${pos[t][1]+5}" text-anchor="middle" font-size="14">T${t}</text>`);
    const serial=ops.every((o,i)=>i===0||o.t===ops[i-1].t||!ops.slice(0,i).some(p=>p.t===o.t));
    $('#csOut').innerHTML=`<div class="cols2"><div><svg viewBox="0 0 300 270" width="300" role="img" aria-label="Precedence graph">${svg}</svg></div><div><p><b>Precedence graph edges</b> (Ti → Tj means Ti must come first):</p>${E.size?`<ul>${[...E].map(([k,v])=>`<li>T${k.replace('>',' → T')} — ${v}</li>`).join('')}</ul>`:'<p class="m">No conflicts at all.</p>'}
      <p>${ok?`<span class="pill g">conflict serializable</span> equivalent serial order: <b>${order.map(t=>'T'+t).join(' → ')}</b>`:'<span class="pill r">NOT conflict serializable</span> the graph has a cycle'}</p>${serial?'<p class="m">The schedule is already serial — no rearranging needed (the view-serializability case).</p>':''}</div></div>`;};
  $('#csIn').oninput=cs;$$('[data-cs]',root).forEach(b=>b.onclick=()=>{$('#csIn').value=b.dataset.cs;cs();});cs();
  const pl=()=>{const toks=[...$('#plIn').value.matchAll(/(LS|LX|U|R|W)\s*\(\s*(\w+)\s*\)/gi)].map(m=>({o:m[1].toUpperCase(),x:m[2].toUpperCase()}));if(!toks.length){$('#plOut').innerHTML='<p class="msg">Enter operations such as LX(A) W(A) U(A).</p>';return;}
    let shrink=false,viol=-1;const chips=toks.map((t,i)=>{if(t.o==='U')shrink=true;if((t.o==='LS'||t.o==='LX')&&shrink&&viol<0)viol=i;return `<div class="chip ${shrink?'':'o'}" style="${viol===i?'background:var(--red2);border-color:var(--red)':''}">${t.o}(${t.x})<small>${viol===i?'lock after unlock!':shrink?'shrinking':'growing'}</small></div>`;});
    const lastOp=toks.map((t,i)=>t.o==='R'||t.o==='W'?i:-1).reduce((a,b)=>Math.max(a,b),-1),firstOp=toks.findIndex(t=>t.o==='R'||t.o==='W');
    const ok2=viol<0,xl=new Set(toks.filter(t=>t.o==='LX').map(t=>t.x));
    const strict=ok2&&toks.every((t,i)=>t.o!=='U'||!xl.has(t.x)||i>lastOp),rig=ok2&&toks.every((t,i)=>t.o!=='U'||i>lastOp),cons=ok2&&toks.every((t,i)=>!(t.o==='LS'||t.o==='LX')||i<firstOp||firstOp<0);
    const row=(n,v)=>`<tr><td class="l">${n}</td><td class="${v?'good':'bad'}">${v?'✓ yes':'✗ no'}</td></tr>`;
    $('#plOut').innerHTML=`<div class="chips">${chips.join('')}</div><div class="scroll"><table class="t"><tr><th class="l">Check</th><th>Result</th></tr>${row('Two-phase locking (no lock after the first unlock)',ok2)}${row('Strict 2PL (exclusive locks released only after the last read/write)',strict)}${row('Rigorous 2PL (no lock released before the last read/write)',rig)}${row('Conservative 2PL (all locks taken before the first read/write)',cons)}</table></div>`;};
  $('#plIn').oninput=pl;$$('[data-pl]',root).forEach(b=>b.onclick=()=>{$('#plIn').value=b.dataset.pl;pl();});pl();
  let ts=[];const tsd=()=>{$('#tsOut').innerHTML=ts.length?htmlTable(['Transaction','Timestamp (T)','Priority'],ts.map((t,i)=>['T'+t,i+1,i===0?'oldest — runs first':'younger — waits if it conflicts with an older one']))+`<p class="m">Order of execution on a conflict: ${ts.map(t=>'T'+t).join(' → ')} (smaller timestamp first).</p>`:'<p>Press the “Start” buttons in any order — each transaction gets the next timestamp as it starts.</p>';};
  $$('[data-t]',root).forEach(b=>b.onclick=()=>{const n=+b.dataset.t;if(!ts.includes(n))ts.push(n);tsd();});$('#tsR').onclick=()=>{ts=[];tsd();};tsd();
});
