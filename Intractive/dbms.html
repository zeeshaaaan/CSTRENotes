section('nosql','NoSQL',`
<ul><li><b>NoSQL</b> — not in SQL; a <b>non-relational</b> database that stores data <b>without a structured form</b>. Data is stored by <b>scaling</b> it.</li><li><b>Horizontal scaling</b> — adding <b>new server machines</b> alongside the existing servers.</li><li><b>Vertical scaling</b> — adding <b>more hardware / storage</b> (RAM, hard disk …) to an existing server.</li></ul>
<div class="tool"><div class="th">Scaling</div><div class="tb"><div class="row"><button class="btn pri" id="scH">Horizontal: add a server</button><button class="btn pri" id="scV">Vertical: add RAM / disk</button><button class="btn" id="scR">Reset</button></div><svg id="scSvg" viewBox="0 0 540 170" width="540" role="img" aria-label="Scaling"></svg><p class="m" id="scMsg"></p></div></div>
<h3>Types of NoSQL databases</h3>
<div class="tool"><div class="th">The same student, four ways</div><div class="tb"><div id="nsTabs"></div><div id="nsBody"></div></div></div>
<h3>Comparison</h3>
<div class="scroll"><table class="t"><tr><th class="l">Feature</th><th>Document based</th><th>Key-value based</th><th>Column based</th><th>Graph based</th></tr>
<tr><td class="l">Data model</td><td>JSON</td><td>Key–value pair</td><td>Column instead of row</td><td>Nodes &amp; edges</td></tr>
<tr><td class="l">Best use</td><td>Semi-structured data</td><td>Fast look-up &amp; caching</td><td>Analytics &amp; big data</td><td>Relationship-heavy data</td></tr>
<tr><td class="l">Query performance</td><td>Moderate</td><td>Fast</td><td>High for analytics</td><td>Optimised for relationships</td></tr>
<tr><td class="l">Schema</td><td>Flexible</td><td>Dynamic</td><td>Semi-structured</td><td>Schema-less</td></tr>
<tr><td class="l">Scalability</td><td>Horizontal</td><td>High, horizontal</td><td>Highly scalable</td><td>Scales with relationships</td></tr></table></div>
`,root=>{
  let h=1,v=1;
  const sc=()=>{let o='';for(let i=0;i<h;i++)o+=svgBox(20+i*70,80,60,50,'Server',i===h-1&&h>1,11);
    const ht=40+v*18;o+=`<rect class="g" x="400" y="${130-ht}" width="110" height="${ht}" style="fill:#e8eaf6"/><text class="pin" x="455" y="${130-ht/2+4}" text-anchor="middle">1 server</text><text class="pin" x="455" y="148" text-anchor="middle" font-size="11">RAM/disk ×${v}</text>`;
    o+=`<text class="pin" x="20" y="150" font-size="11">${h} server machine${h>1?'s':''}</text>`;$('#scSvg').innerHTML=o;$('#scMsg').textContent=`Horizontal: ${h} server(s) share the load.   Vertical: one server with ${v}× the hardware.`;};
  $('#scH').onclick=()=>{h=Math.min(5,h+1);sc();};$('#scV').onclick=()=>{v=Math.min(5,v+1);sc();};$('#scR').onclick=()=>{h=1;v=1;sc();};sc();
  const G=`<svg viewBox="0 0 400 190" width="400" role="img" aria-label="Graph database"><g stroke="#15233b" stroke-width="1.8"><line x1="200" y1="95" x2="70" y2="40"/><line x1="200" y1="95" x2="330" y2="40"/><line x1="200" y1="95" x2="70" y2="150"/><line x1="200" y1="95" x2="330" y2="150"/></g>${[['Std',200,95],['S.No.',70,40],['Sname',330,40],['DoB',70,150],['S-Add',330,150]].map(([t,x,y])=>`<ellipse cx="${x}" cy="${y}" rx="38" ry="20" class="g" style="${t==='Std'?'fill:#fff0c9':''}"/><text class="pin" x="${x}" y="${y+4}" text-anchor="middle">${t}</text>`).join('')}</svg>`;
  const TY=[['Document based','JSON format — e.g. MongoDB, CouchDB, Firebase.',()=>`<pre class="code">${esc('{ "S.No": 101,\n  "Sname": "Asha",\n  "DoB": "2008-04-12",\n  "S-Add": "Jaipur" }')}</pre>`],
    ['Key-value based','Key–value pairs — e.g. Amazon DynamoDB, Redis, Memcached.',()=>`<pre class="code">${esc('"std:101:name"  → "Asha"\n"std:101:dob"   → "2008-04-12"\n"std:101:addr"  → "Jaipur"')}</pre>`],
    ['Wide / column based','Like an RDBMS but data is stored in <b>columns instead of rows</b> — e.g. Apache Cassandra, HBase, Google Bigtable; used in Netflix, Facebook etc.',()=>`<div class="cols2"><div><b>Row-oriented (RDBMS)</b><pre class="code">${esc('101, Asha, 11, 12000\n102, Ravi, 11, 15000\n103, Seeta, 12, 15000')}</pre></div><div><b>Column-oriented</b><pre class="code">${esc('Id:    101, 102, 103\nName:  Asha, Ravi, Seeta\nClass: 11, 11, 12\nFee:   12000, 15000, 15000')}</pre></div></div><p>“Average fee” reads only the <b>Fee</b> column — fast for analytics.</p>`],
    ['Graph based','Data stored as <b>nodes and edges</b> — e.g. Amazon Neptune, ArangoDB, Neo4j.',()=>G]];
  Tabs($('#nsTabs'),TY.map(t=>t[0]),k=>{$('#nsBody').innerHTML=`<p>${TY[k][1]}</p>${TY[k][2]()}`;});
});

/* ================= 15 ACID ================= */
section('acid','ACID properties',`
<p class="lead">A <b>transaction</b> must be Atomic, Consistent, Isolated and Durable.</p>
<ul><li><b>Atomicity</b> — either <b>all or none</b>: the transaction executes completely or no part of it executes.</li><li><b>Consistency</b> — the <b>total amount before the transaction starts and after it ends remains the same</b>.</li><li><b>Isolation</b> — parallel (concurrent) transactions run in a way that is <b>equivalent to some serial order</b>, so no inconsistency occurs.</li><li><b>Durability</b> — once changes are <b>committed</b> they are permanent, even after hardware or software failure.</li></ul>
<div class="tool"><div class="th">Atomicity and consistency — transfer money from A to B</div><div class="tb">
<div class="row"><label for="acAmt">Amount</label><input type="text" id="acAmt" value="500" size="6"><label><input type="checkbox" id="acTx" checked> use a transaction (atomic)</label><label><input type="checkbox" id="acCr"> crash after A is debited</label><button class="btn pri" id="acGo">Run transfer</button><button class="btn" id="acR">Reset</button></div>
<div id="acOut"></div></div></div>
<div class="tool"><div class="th">Durability — commit, then crash</div><div class="tb"><div class="row"><button class="btn pri" id="duUp">Update (A = 500, B = 4500)</button><button class="btn pri" id="duCm">COMMIT</button><button class="btn pri" id="duCr">Power failure</button><button class="btn" id="duR">Reset</button></div><div id="duOut"></div></div></div>
<div class="tool"><div class="th">Isolation — two users withdraw from account A (starts at 1000)</div><div class="tb"><div id="isTabs"></div><div id="isOut"></div><div class="row"><button class="btn pri" id="isNext">Next step</button><button class="btn" id="isR">Restart</button></div></div></div>
`,root=>{
  let A,B,log;const rs=()=>{A=1000;B=4000;log='';ac();};
  const ac=()=>{$('#acOut').innerHTML=htmlTable(['Account','Balance'],[['A',A],['B',B],['Total',A+B]],{cell:(v,i,j)=>i===2&&j===1?(v===5000?'good':'bad'):''})+(log||'')+`<p class="m" style="font-size:13.5px">The total must stay <b>5000</b> (the notes' example: A = 1000, B = 4000, transfer 500).</p>`;};
  $('#acGo').onclick=()=>{const amt=+$('#acAmt').value||0,tx=$('#acTx').checked,cr=$('#acCr').checked;const a0=A,b0=B;A-=amt;
    if(cr){if(tx){A=a0;B=b0;log='<div class="okm">Crash! The transaction was not committed, so the DBMS rolled it back — A and B are exactly as before. <b>Atomicity</b>: all or none.</div>';}else log='<div class="err">Crash after the debit and no transaction: A lost the money but B never received it. The total is no longer 5000 — consistency is broken.</div>';}
    else{B+=amt;log=`<div class="okm">Transfer completed${tx?' and committed':''}. Total unchanged → consistent.</div>`;}ac();};
  $('#acR').onclick=rs;rs();
  let mem,disk,dmsg;const du=()=>{$('#duOut').innerHTML=htmlTable(['','A','B'],[['In memory (uncommitted)',mem[0],mem[1]],['On disk (committed)',disk[0],disk[1]]])+(dmsg||'');};
  const dr=()=>{mem=[1000,4000];disk=[1000,4000];dmsg='';du();};
  $('#duUp').onclick=()=>{mem=[500,4500];dmsg='';du();};$('#duCm').onclick=()=>{disk=mem.slice();dmsg='<div class="okm">COMMIT: the change is now permanent in the database.</div>';du();};
  $('#duCr').onclick=()=>{const kept=disk.slice();mem=kept.slice();dmsg=(kept[0]===500)?'<div class="okm">Power failure! The change had been committed, so it is still there: <b>durability</b>.</div>':'<div class="err">Power failure! The change was never committed, so it is lost — only committed data is guaranteed.</div>';du();};
  $('#duR').onclick=dr;dr();
  let mode=0,step=0;const S0=[['T1 reads A','1000','T1: A = 1000'],['T2 reads A','1000','T2: A = 1000'],['T1 writes A = A − 100','900','A = 900'],['T2 writes A = A − 200','800','A = 800 — T1’s update is lost!']],
    S1=[['T1 reads A','1000','T1: A = 1000'],['T1 writes A = A − 100','900','A = 900'],['T1 commits (lock released)','900','committed'],['T2 reads A','900','T2: A = 900'],['T2 writes A = A − 200','700','A = 700']];
  const is=()=>{const S=mode?S1:S0;$('#isOut').innerHTML=htmlTable(['Step','Action','Account A'],S.slice(0,step).map((s,i)=>[i+1,s[0],s[2]]),{cell:(v,i,j)=>(!mode&&step===S.length&&i===S.length-1&&j===2)?'bad':(mode&&step===S.length&&i===S.length-1&&j===2)?'good':''})+(step===S.length?(mode?'<div class="okm">With isolation the result equals the serial order T1 then T2: 1000 − 100 − 200 = <b>700</b> ✓.</div>':'<div class="err">Without isolation the final balance is 800, but two withdrawals (100 + 200) should leave 700. Inconsistent data.</div>'):'');};
  Tabs($('#isTabs'),['Without isolation (interleaved)','With isolation (serial equivalent)'],k=>{mode=k;step=0;is();});
  $('#isNext').onclick=()=>{const S=mode?S1:S0;step=Math.min(S.length,step+1);is();};$('#isR').onclick=()=>{step=0;is();};
});

section('fixes','Clarifications',`
<p>While typing up the handwritten notes these points were clarified or corrected.</p>
<div class="scroll"><table class="t"><tr><th class="l">Topic</th><th class="l">Handwritten notes</th><th class="l">Here</th></tr>
<tr><td class="l">Data independence</td><td class="l">Heading says “Data Dependence”</td><td class="l">Content is data <i>independence</i></td></tr>
<tr><td class="l">Units of data</td><td class="l">Database = “collection of fields”</td><td class="l">Kept; strictly a collection of related files / tables</td></tr>
<tr><td class="l">ER diagram</td><td class="l">Dashed / solid ellipses hard to tell apart</td><td class="l">Duration treated as derived</td></tr>
<tr><td class="l">Super-key count, Q2</td><td class="l">2³ + 2³ + 2²</td><td class="l">2³ + 2³ − 2² = 12</td></tr>
<tr><td class="l">Codd's rules</td><td class="l">Numbered (1)–(13) with a crossed-out duplicate</td><td class="l">Rule 0 – Rule 12</td></tr>
<tr><td class="l"><b>Normalization practice questions</b></td><td class="l">2NF Q2, 3NF Q1 and BCNF Q list candidate keys that do not follow from the FDs shown</td><td class="l">The analyzer computes keys from the FDs and can give a different verdict — see the warning in chapter 10</td></tr>
<tr><td class="l">4NF decomposition</td><td class="l">R1(SID, SName) and R2(CID, CName)</td><td class="l">They share no attribute, so joining gives every pairing (8 rows vs 4) — not lossless. A Student–Course–Hobby example is added</td></tr>
<tr><td class="l">Non-trivial FD</td><td class="l">“x ∩ y ≠ 0”</td><td class="l">X ∩ Y = ∅</td></tr>
<tr><td class="l">DELETE syntax; DISTINCT</td><td class="l">DELETE Student where …; “applies on first”</td><td class="l">DELETE FROM …; DISTINCT covers all selected columns</td></tr>
<tr><td class="l">2PL advantage</td><td class="l">Deadlock avoidance</td><td class="l">Fully true only for conservative 2PL</td></tr></table></div>
`,null);
